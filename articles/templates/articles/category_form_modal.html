<form method="post" class="auth-form" id="categoryModalForm"
      action="{% if is_edit %}{% url 'articles:category_edit' category.pk %}{% else %}{% url 'articles:category_create' %}{% endif %}">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">{% if is_edit %}Simpan Perubahan{% else %}Tambah Kategori{% endif %}</button>
</form>
