{% extends 'auth_base.html' %}
{% load static %}
{% block title %}Login - Pena Digital{% endblock %}
{% block extra_css %}
    <link rel="stylesheet" href="{% static 'css/forms.css' %}">
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
{% endblock %}

{% block content %}
<div class="auth-card">
    <img src="{% static 'images/pendigi-logo-tulisan.svg' %}" alt="Pena Digital" class="logo">
    <h2>Masuk ke Akun</h2>
    <p class="auth-subtitle">Selamat datang kembali di Pena Digital</p>

    <form method="post" class="auth-form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Masuk</button>
    </form>

    <div class="auth-form-footer">
        Belum punya akun? <a href="{% url 'register' %}">Daftar di sini</a>
    </div>
</div>
{% endblock %}
