{% extends 'app_base.html' %}
{% block title %}Bookmark Saya{% endblock %}

{% block content %}
<h1 class="section-title">Artikel Tersimpan</h1>
<div class="article-grid">
    {% for bookmark in bookmarks %}
        <a href="{% url 'articles:article_detail' bookmark.article.pk %}" class="article-card">
            <div class="article-card-body">
                <span class="category-tag">{{ bookmark.article.category.name }}</span>
                <h3>{{ bookmark.article.title }}</h3>
            </div>
        </a>
    {% empty %}
        <p>Belum ada artikel yang disimpan.</p>
    {% endfor %}
</div>
{% endblock %}
